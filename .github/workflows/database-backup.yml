name: Independent database backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bella-production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: [self-hosted, linux, bella-production]
    environment: production-backup
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_BACKUP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DR_REGION }}
      - name: Create checksum-verified independent backup copies
        working-directory: com.bellatechnologies.backend
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_NAME: bella_technologies
          DATABASE_USERNAME: ${{ secrets.DATABASE_BACKUP_USERNAME }}
          PGPASSWORD: ${{ secrets.DATABASE_BACKUP_PASSWORD }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_BACKUP_STORAGE_ACCOUNT }}
          AZURE_BACKUP_CONTAINER: ${{ vars.AZURE_BACKUP_CONTAINER }}
          AWS_BACKUP_BUCKET: ${{ vars.AWS_DR_BACKUP_BUCKET }}
        run: ./scripts/backup-postgres.sh
