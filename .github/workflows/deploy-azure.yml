name: Deploy backend to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag to deploy, or blank to use the current commit SHA
        required: false
  push:
    branches: [main]
    paths:
      - "com.bellatechnologies.backend/src/**"
      - "com.bellatechnologies.backend/pom.xml"
      - "com.bellatechnologies.backend/Dockerfile"

permissions:
  contents: read
  id-token: write

concurrency:
  group: bella-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify
        working-directory: com.bellatechnologies.backend
        run: mvn --batch-mode verify
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image
        working-directory: com.bellatechnologies.backend
        run: |
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"
          docker build --tag "${{ vars.AZURE_ACR_LOGIN_SERVER }}/bella-backend:${IMAGE_TAG}" .
          docker push "${{ vars.AZURE_ACR_LOGIN_SERVER }}/bella-backend:${IMAGE_TAG}"
      - name: Deploy revision
        run: |
          az containerapp update             --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"             --name "${{ vars.AZURE_CONTAINER_APP }}"             --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/bella-backend:${IMAGE_TAG}"
      - name: Verify readiness
        run: |
          fqdn="$(az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_CONTAINER_APP }}" --query properties.configuration.ingress.fqdn -o tsv)"
          curl --fail --retry 12 --retry-delay 10 "https://${fqdn}/actuator/health/readiness"
