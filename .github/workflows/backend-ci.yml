name: Backend CI

on:
  pull_request:
    paths:
      - "com.bellatechnologies.backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "com.bellatechnologies.backend/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: com.bellatechnologies.backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify
      - run: docker build --tag bella-backend:${{ github.sha }} .
